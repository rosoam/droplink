[package]
name = "droplink-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DropLink native desktop and iOS app"

[lib]
name = "droplink_app"
crate-type = ["rlib"]

[[bin]]
name = "droplink"
path = "src/main.rs"

[dependencies]
droplink-core = { path = "../droplink-core", version = "1.0.0" }
droplink-net = { path = "../droplink-net", version = "1.0.0" }
egui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
hostname.workspace = true

[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu = { version = "27", features = ["metal"] }
droplink-ios-bridge = { path = "../droplink-ios-bridge", version = "1.0.0" }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[package.metadata.bundle]
name = "DropLink"
identifier = "com.droplink.desktop"
short_description = "Transfert de fichiers P2P chiffré"
long_description = "DropLink transfère des fichiers entre appareils du même réseau, sans compte et sans serveur, avec chiffrement de bout en bout."
category = "Utility"
icon = ["../../assets/icon.icns"]
osx_minimum_system_version = "11.0"
