name: CI

# CI lourde : uniquement sur un tag de version, jamais sur un push de branche.
# Un push sur main ne déclenche rien. Pas de PR non plus.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          sudo systemctl stop unattended-upgrades || true
          for i in 1 2 3; do
            sudo timeout 240 apt-get update -o Acquire::Retries=3 && break || sleep 10
          done
          sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Stage desktop binary
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows) cp target/release/droplink.exe dist/droplink-windows-x86_64.exe ;;
            macOS) cp target/release/droplink dist/droplink-macos-aarch64 ;;
            Linux) cp target/release/droplink dist/droplink-linux-x86_64 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: droplink-${{ runner.os }}
          path: dist/*


  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        timeout-minutes: 12
        run: |
          sudo systemctl stop unattended-upgrades || true
          for i in 1 2 3; do
            sudo timeout 240 apt-get update -o Acquire::Retries=3 && break || sleep 10
          done
          sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 85 --ignore-filename-regex 'main\.rs$|app\.rs$|xtask/'

  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        timeout-minutes: 12
        run: |
          sudo systemctl stop unattended-upgrades || true
          for i in 1 2 3; do
            sudo timeout 240 apt-get update -o Acquire::Retries=3 && break || sleep 10
          done
          sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Compile benches
        run: cargo bench -p droplink-core -p droplink-net --no-run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  size-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p droplink-app
      - name: Check binary size (< 22 MiB)
        run: |
          SIZE=$(stat -f%z target/release/droplink)
          echo "binary bytes: $SIZE"
          test "$SIZE" -lt 23068672
