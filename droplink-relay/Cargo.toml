[package]
name = "droplink-relay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "droplink-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
